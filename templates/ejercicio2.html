{% extends 'base.html' %}

{% block titulo %}Ejercicio 2{% endblock %}

{% block contenido %}
<div class="container centrado">
    <form method="POST">
        <div class="form-group">
            <label for="nombre1">Nombre 1:</label>
            <input type="text" id="nombre1" name="nombre1" value="{{ nombre1 }}" required>
        </div>
        <div class="form-group">
            <label for="nombre2">Nombre 2:</label>
            <input type="text" id="nombre2" name="nombre2" value="{{ nombre2 }}" required>
        </div>
        <div class="form-group">
            <label for="nombre3">Nombre 3:</label>
            <input type="text" id="nombre3" name="nombre3" value="{{ nombre3 }}" required>
        </div>
        <input type="submit" value="Enviar">
    </form>

    {% if mayor %}
        <p>El nombre con mayor cantidad de caracteres es : {{ mayor }}</p>
        <p>El nombre tiene : {{ cantidad }} caracteres</p>
    {% endif %}

    <a href="/" class="volver">Volver al menu</a>
</div>
{% endblock %}
