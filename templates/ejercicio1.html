{% extends 'base.html' %}

{% block titulo %}Ejercicio 1{% endblock %}

{% block contenido %}
<div class="container">
    <h2>Formulario de Notas</h2>
    <form method="POST">
        <div class="form-group">
            <label for="nota1">Nota 1:</label>
            <input type="text" id="nota1" name="nota1" value="{{ nota1 }}" required>
        </div>
        <div class="form-group">
            <label for="nota2">Nota 2:</label>
            <input type="text" id="nota2" name="nota2" value="{{ nota2 }}" required>
        </div>
        <div class="form-group">
            <label for="nota3">Nota 3:</label>
            <input type="text" id="nota3" name="nota3" value="{{ nota3 }}" required>
        </div>
        <div class="form-group">
            <label for="asistencia">Asistencia (%):</label>
            <input type="text" id="asistencia" name="asistencia" value="{{ asistencia }}" required>
        </div>
        <input type="submit" value="Enviar">
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if promedio %}
        <p>{{ promedio }}</p>
        <p>{{ estado }}</p>
    {% endif %}

    <a href="/" class="volver">Volver al menu</a>
</div>
{% endblock %}
